name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # ubuntu-24.04 : Python 3.9 n'est plus disponible sur ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 3.9 : Raspberry Pi OS 11 (bullseye), version minimale prise en charge
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[test,influxdb]"
      - run: python -m pytest -q
      - run: shellcheck install.sh
